/* === src/sidebar.jsx === */
/* Sidebar — folder tree, smart views, tags, approvals */
const { useState } = React;

function SectionLabel({ children, action }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '12px 14px 6px', color: 'var(--fg-dim)', fontSize: 10.5, letterSpacing: '0.08em', textTransform: 'uppercase', fontWeight: 600 }}>
      <span>{children}</span>
      {action}
    </div>
  );
}

function NavItem({ icon, label, count, active, onClick, badge, badgeTone, indent = 0 }) {
  return (
    <button onClick={onClick} className="nav-item" data-active={active || undefined} style={{
      display: 'flex', alignItems: 'center', gap: 9,
      width: 'calc(100% - 12px)', margin: '0 6px',
      padding: `7px 10px 7px ${10 + indent * 14}px`,
      borderRadius: 6, color: active ? 'var(--fg)' : 'var(--fg-muted)',
      background: active ? 'var(--bg-active)' : 'transparent',
      fontSize: 13, textAlign: 'left', lineHeight: 1.2,
      transition: 'background 0.12s, color 0.12s',
    }}>
      {icon}
      <span style={{ flex: 1, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', fontWeight: active ? 500 : 400 }}>{label}</span>
      {count != null && <span style={{ fontSize: 11, color: 'var(--fg-dim)', fontVariantNumeric: 'tabular-nums' }}>{count}</span>}
      {badge && <span style={{ fontSize: 10, fontWeight: 600, padding: '1px 6px', borderRadius: 10, background: badgeTone || 'var(--accent-soft)', color: badgeTone ? '#fff' : 'var(--accent)' }}>{badge}</span>}
    </button>
  );
}

function FolderNode({ node, depth, selectedFolder, onSelect, expanded, onToggle }) {
  const open = expanded.has(node.id);
  const hasKids = node.children && node.children.length > 0;
  const active = selectedFolder === node.id;

  return (
    <div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 2, margin: '0 6px' }}>
        {hasKids ? (
          <button onClick={() => onToggle(node.id)} style={{
            width: 18, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center',
            marginLeft: depth * 14, color: 'var(--fg-dim)', borderRadius: 4,
          }}>
            <Icon.Chev size={11} stroke={2} style={{ transform: open ? 'rotate(90deg)' : 'none', transition: 'transform 0.12s' }} />
          </button>
        ) : (
          <span style={{ width: 18, marginLeft: depth * 14 }} />
        )}
        <button onClick={() => onSelect(node.id)} data-active={active || undefined} className="nav-item" style={{
          flex: 1, display: 'flex', alignItems: 'center', gap: 8,

/* Topbar — breadcrumb, live search, view toggle, actions */
const { useState: useStateTb, useRef: useRefTb, useEffect: useEffectTb } = React;

function Crumb({ children, onClick, last }) {
  return (
    <>
      <button onClick={onClick} style={{
        padding: '3px 6px', borderRadius: 5, color: last ? 'var(--fg)' : 'var(--fg-muted)',
        fontSize: 13, fontWeight: last ? 500 : 400,
      }} className="nav-item">
        {children}
      </button>
      {!last && <Icon.Chev size={11} style={{ color: 'var(--fg-dim)' }} />}
    </>
  );
}

function SearchField({ value, onChange, onSelectResult, data }) {
  const [open, setOpen] = useStateTb(false);
  const ref = useRefTb();

  const q = value.trim().toLowerCase();
  const hits = q.length > 0 ? data.docs.filter(d => d.name.toLowerCase().includes(q)).slice(0, 6) : [];
  const folderHits = q.length > 0 ? flattenFolders(data.folders).filter(f => f.name.toLowerCase().includes(q) && f.id !== 'root').slice(0, 3) : [];

  useEffectTb(() => {
    const h = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', h);
    const k = (e) => { if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); ref.current?.querySelector('input')?.focus(); setOpen(true); } };
    document.addEventListener('keydown', k);
    return () => { document.removeEventListener('mousedown', h); document.removeEventListener('keydown', k); };
  }, []);

  return (
    <div ref={ref} style={{ position: 'relative', flex: 1, maxWidth: 560 }}>
      <div style={{
        display: 'flex', alignItems: 'center', gap: 8,
        background: 'var(--bg-elev-2)', border: '1px solid var(--border)',
        borderRadius: 7, padding: '6px 10px', height: 32,
      }}>
        <Icon.Search size={14} style={{ color: 'var(--fg-dim)' }} />
        <input
          value={value}
          onChange={e => { onChange(e.target.value); setOpen(true); }}
          onFocus={() => setOpen(true)}
          placeholder="Buscar documentos, carpetas, personas…"
          style={{
            flex: 1, background: 'transparent', border: 0, outline: 'none',
            fontSize: 13, color: 'var(--fg)',
          }}
        />
        <kbd style={{
          fontSize: 10, fontFamily: 'JetBrains Mono, monospace',
          color: 'var(--fg-dim)', padding: '1px 5px',
          border: '1px solid var(--border)', borderRadius: 4, background: 'var(--bg)',
        }}>⌘K</kbd>
      </div>

      {open && (q.length > 0 || true) && (
        <div style={{
          position: 'absolute', top: 'calc(100% + 6px)', left: 0, right: 0,
          background: 'var(--bg-elev)', border: '1px solid var(--border)',
          borderRadius: 9, boxShadow: 'var(--shadow)', zIndex: 50,
          maxHeight: 400, overflow: 'auto',
        }}>
          {q.length === 0 ? (
            <div style={{ padding: '10px 14px', fontSize: 11, color: 'var(--fg-dim)', letterSpacing: '0.06em', textTransform: 'uppercase', fontWeight: 600 }}>
              Búsquedas sugeridas
            </div>
          ) : null}
          {q.length === 0 && [
            { q: 'contratos vencidos', icon: <Icon.File size={13} /> },
            { q: 'tag:confidencial', icon: <Icon.Tag size={13} /> },
            { q: 'owner:Laura tipo:pdf', icon: <Icon.Users size={13} /> },
          ].map((s, i) => (
            <button key={i} onClick={() => onChange(s.q)} className="nav-item" style={{
              display: 'flex', alignItems: 'center', gap: 10, padding: '8px 14px',
              width: '100%', textAlign: 'left', color: 'var(--fg-muted)', fontSize: 13,
            }}>
              <span style={{ color: 'var(--fg-dim)' }}>{s.icon}</span>
              <span style={{ fontFamily: 'JetBrains Mono, monospace', fontSize: 12 }}>{s.q}</span>
            </button>
          ))}

          {folderHits.length > 0 && (
            <>
              <div style={{ padding: '10px 14px 4px', fontSize: 11, color: 'var(--fg-dim)', letterSpacing: '0.06em', textTransform: 'uppercase', fontWeight: 600 }}>Carpetas</div>
              {folderHits.map(f => (
                <button key={f.id} className="nav-item" style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '8px 14px', width: '100%', textAlign: 'left', color: 'var(--fg)', fontSize: 13 }}>
                  <Icon.Folder size={14} style={{ color: 'var(--fg-dim)' }} />
                  <span>{f.name}</span>
                  <span style={{ marginLeft: 'auto', fontSize: 11, color: 'var(--fg-dim)' }}>{f.count} docs</span>
                </button>
              ))}
            </>
          )}

          {hits.length > 0 && (
            <>
              <div style={{ padding: '10px 14px 4px', fontSize: 11, color: 'var(--fg-dim)', letterSpacing: '0.06em', textTransform: 'uppercase', fontWeight: 600 }}>Documentos</div>
              {hits.map(d => (
                <button key={d.id} onClick={() => { onSelectResult(d.id); setOpen(false); }} className="nav-item" style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '8px 14px', width: '100%', textAlign: 'left', color: 'var(--fg)', fontSize: 13 }}>
                  <KindBadge kind={d.kind} small />
                  <span style={{ flex: 1, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{highlight(d.name, q)}</span>
                  <span style={{ fontSize: 11, color: 'var(--fg-dim)' }}>{d.modified}</span>
                </button>
              ))}
            </>
          )}

          {q.length > 0 && hits.length === 0 && folderHits.length === 0 && (
            <div style={{ padding: '18px 14px', fontSize: 13, color: 'var(--fg-dim)', textAlign: 'center' }}>
              Sin resultados para “{q}”
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function highlight(text, q) {
  if (!q) return text;
  const i = text.toLowerCase().indexOf(q);
  if (i < 0) return text;
  return <>{text.slice(0,i)}<mark style={{ background: 'var(--accent-soft)', color: 'var(--fg)', padding: 0 }}>{text.slice(i, i+q.length)}</mark>{text.slice(i+q.length)}</>;
}

function flattenFolders(folders, acc = []) {
  for (const f of folders) {
    acc.push(f);
    if (f.children) flattenFolders(f.children, acc);
  }
  return acc;
}

function KindBadge({ kind, small }) {
  const k = window.APP_DATA.kinds[kind];
  return (

      fontSize: small ? 9 : 10, fontFamily: 'JetBrains Mono, monospace', fontWeight: 600,

      flexShrink: 0,

  );
}

  );
}

function OwnerAvatar({ userId, size = 20 }) {
  const u = window.APP_DATA.users.find(u => u.id === userId);
  if (!u) return null;
  return (
    <span title={u.name} style={{
      width: size, height: size, borderRadius: size/2, background: u.color,
      display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
      color: '#0e0f12', fontSize: size * 0.45, fontWeight: 600, flexShrink: 0,
      border: '1.5px solid var(--bg-elev)',
    }}>{u.initials}</span>
  );
}

function AvatarStack({ ids, max = 3 }) {
  const shown = ids.slice(0, max);
  const extra = ids.length - shown.length;
  return (
    <div style={{ display: 'inline-flex' }}>
      {shown.map((id, i) => (
        <span key={id} style={{ marginLeft: i === 0 ? 0 : -6 }}>
          <OwnerAvatar userId={id} size={20} />
        </span>
      ))}
      {extra > 0 && (
        <span style={{
          marginLeft: -6, width: 20, height: 20, borderRadius: 10,
          background: 'var(--bg-active)', color: 'var(--fg-muted)',
          fontSize: 9, fontWeight: 600, display: 'inline-flex',
          alignItems: 'center', justifyContent: 'center', border: '1.5px solid var(--bg-elev)',
        }}>+{extra}</span>
      )}
    </div>
  );
}

function StatusPill({ status }) {
  const map = {
    'borrador':        { label: 'Borrador',       color: 'var(--fg-dim)' },
    'revision':        { label: 'En revisión',    color: 'oklch(0.72 0.13 255)' },
    'pendiente-firma': { label: 'Pendiente firma',color: 'oklch(0.78 0.14 75)' },
    'publicado':       { label: 'Publicado',      color: 'oklch(0.75 0.14 155)' },
    'firmado':         { label: 'Firmado',        color: 'oklch(0.75 0.14 155)' },
    'archivado':       { label: 'Archivado',      color: 'var(--fg-dim)' },
  };
  const s = map[status] || map.borrador;
  return (
    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5, fontSize: 11.5, color: s.color }}>
      <span style={{ width: 6, height: 6, borderRadius: 3, background: s.color }} />
      {s.label}
    </span>
  );
}

function TagChip({ id }) {
  const t = window.APP_DATA.tags.find(t => t.id === id);
  if (!t) return null;
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', gap: 4,
      padding: '1px 6px', borderRadius: 10, fontSize: 10.5,
      color: t.color, background: `color-mix(in oklch, ${t.color} 14%, transparent)`,
    }}>
      {t.label}
    </span>
  );
}

function Checkbox({ checked, onChange, indeterminate }) {

function OverviewCards({ data, onAction }) {
  const cards = [
    { label: 'Documentos totales', value: data.stats.total.toLocaleString('es-ES'), delta: `+${data.stats.deltaWeek} esta semana`, deltaTone: 'var(--ok)' },
    { label: 'Pendientes de firma', value: data.stats.pendientes, delta: '3 vencen hoy', deltaTone: 'var(--warn)' },
    { label: 'Compartidos externos', value: data.stats.compartidos, delta: '12 con acceso expirado', deltaTone: 'var(--fg-dim)' },
    { label: 'Almacenamiento', value: `${data.stats.storage.used} GB`, delta: `${Math.round((data.stats.storage.used / data.stats.storage.total) * 100)}% usado`, deltaTone: 'var(--fg-dim)' },
  ];
  return (
    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 12, padding: '16px 18px 4px' }}>
      {cards.map(c => (
        <div key={c.label} style={{ background: 'var(--bg-elev)', border: '1px solid var(--border)', borderRadius: 10, padding: '12px 14px' }}>
          <div style={{ fontSize: 11.5, color: 'var(--fg-dim)', letterSpacing: '0.02em', marginBottom: 6 }}>{c.label}</div>
          <div style={{ fontSize: 22, fontWeight: 600, color: 'var(--fg)', fontVariantNumeric: 'tabular-nums', lineHeight: 1.1, marginBottom: 6 }}>{c.value}</div>
          <div style={{ fontSize: 11, color: c.deltaTone }}>{c.delta}</div>
        </div>
      ))}
    </div>
  );
}

/* Tweaks panel — edits color/theme/sidebar/density live */
const { useState: useStateTw, useEffect: useEffectTw } = React;

function TweaksPanel({ state, setState }) {
  const [mode, setMode] = useStateTw(false);
  useEffectTw(() => {
    const onMsg = (e) => {
      if (e.data?.type === '__activate_edit_mode') setMode(true);
      if (e.data?.type === '__deactivate_edit_mode') setMode(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const set = (patch) => {

  if (!mode) return null;

  return (
    <div style={{
      position: 'fixed', right: 16, bottom: 16, zIndex: 300, width: 260,

                flex: 1, padding: '7px 10px', borderRadius: 6, fontSize: 12,

                flex: 1, padding: '7px 10px', borderRadius: 6, fontSize: 12,

/* Main app — glue + state + DnD + keyboard + dashboard view */
const { useState: useS, useEffect: useE, useMemo: useM, useRef: useR } = React;

function getFolderPath(folders, targetId, path = []) {
  for (const f of folders) {
    const p = [...path, f];
    if (f.id === targetId) return p;
    if (f.children) {
      const found = getFolderPath(f.children, targetId, p);
      if (found) return found;
    }
  }
  return null;
}

function App() {
  const data = window.APP_DATA;
  const [tweaks, setTweaks] = useS(window.TWEAKS);

  // persist / apply tweaks
  useE(() => {
    document.documentElement.setAttribute('data-theme', tweaks.theme);
    document.documentElement.style.setProperty('--accent', `oklch(0.72 0.13 ${tweaks.accentHue})`);
    document.documentElement.style.setProperty('--accent-soft', `oklch(0.55 0.13 ${tweaks.accentHue} / 0.22)`);
    if (tweaks.theme === 'light') {
      document.documentElement.style.setProperty('--accent', `oklch(0.5 0.15 ${tweaks.accentHue})`);
      document.documentElement.style.setProperty('--accent-soft', `oklch(0.5 0.15 ${tweaks.accentHue} / 0.12)`);
    }
  }, [tweaks]);

  // State
  const [selectedView, setSelectedView] = useS('inicio');      // inicio | recientes | compartidos | favoritos | aprobaciones | papelera | carpeta
  const [selectedFolder, setSelectedFolder] = useS('root');
  const [selectedTag, setSelectedTag] = useS(null);
  const [search, setSearch] = useS('');
  const [viewMode, setViewMode] = useS('list');
  const [filters, setFilters] = useS({ kind: null, owner: null, status: null, date: null });
  const [selected, setSelected] = useS(new Set());
  const [openDocId, setOpenDocId] = useS(null);
  const [ctxMenu, setCtxMenu] = useS(null);
  const [notifOpen, setNotifOpen] = useS(false);
  const [dragging, setDragging] = useS(false);
  const [toast, setToast] = useS(null);
  const dragCounter = useR(0);

  // filter docs
  const visibleDocs = useM(() => {
    let list = data.docs;
    if (selectedView === 'favoritos') list = list.filter(d => d.starred);
    else if (selectedView === 'compartidos') list = list.filter(d => d.shared.length > 0 && d.owner !== 'u1');
    else if (selectedView === 'aprobaciones') list = list.filter(d => d.status === 'pendiente-firma' || d.status === 'revision');
    else if (selectedView === 'papelera') list = [];
    else if (selectedView === 'recientes') list = [...list].sort((a,b) => a.modified.localeCompare(b.modified));
    else if (selectedView === 'carpeta' && selectedFolder !== 'root') {
      list = list.filter(d => d.folder === selectedFolder);
    }
    if (selectedTag) list = list.filter(d => d.tags.includes(selectedTag));
    if (filters.kind)   list = list.filter(d => d.kind === filters.kind);
    if (filters.owner)  list = list.filter(d => d.owner === filters.owner);
    if (filters.status) list = list.filter(d => d.status === filters.status);
    if (search.trim()) {
      const q = search.trim().toLowerCase();
      list = list.filter(d => d.name.toLowerCase().includes(q));
    }
    return list;
  }, [data.docs, selectedView, selectedFolder, selectedTag, filters, search]);

  const breadcrumb = useM(() => {
    if (selectedView === 'inicio')       return [{ id: 'inicio', label: 'Inicio' }];
    if (selectedView === 'recientes')    return [{ id: 'recientes', label: 'Recientes' }];
    if (selectedView === 'compartidos')  return [{ id: 'compartidos', label: 'Compartidos conmigo' }];
    if (selectedView === 'favoritos')    return [{ id: 'favoritos', label: 'Favoritos' }];
    if (selectedView === 'aprobaciones') return [{ id: 'aprobaciones', label: 'Aprobaciones' }];
    if (selectedView === 'papelera')     return [{ id: 'papelera', label: 'Papelera' }];
    const path = getFolderPath(data.folders, selectedFolder);
    return path ? path.map(n => ({ id: n.id, label: n.name })) : [{ id: 'root', label: 'Archivo' }];
  }, [selectedView, selectedFolder, data.folders]);

  // selection helpers
  const toggleSelect = (id) => {
    const n = new Set(selected);
    n.has(id) ? n.delete(id) : n.add(id);
    setSelected(n);
  };
  const selectAll = () => {
    if (selected.size === visibleDocs.length) setSelected(new Set());
    else setSelected(new Set(visibleDocs.map(d => d.id)));
  };
  const clearSel = () => setSelected(new Set());

  const openDoc = (id) => setOpenDocId(id);
  const contextMenu = (e, docId) => setCtxMenu({ x: e.clientX, y: e.clientY, docId });

  const handleAction = (action, docId) => {
    const msgs = {
      upload: 'Selecciona archivos para subir',
      new: 'Nuevo documento creado',
      download: 'Descarga iniciada',
      share: 'Enlace copiado al portapapeles',
      sign: 'Solicitud de firma enviada',
      trash: 'Movido a papelera',
      move: 'Selecciona destino…',
      tag: 'Etiquetas actualizadas',
      star: 'Añadido a favoritos',
      rename: 'Renombrar — modo edición',
      open: 'Abriendo documento…',
      preview: 'Vista previa activada',
      fullscreen: 'Abriendo completo…',
    };
    setToast(msgs[action] || `Acción: ${action}`);
    if (action === 'open' || action === 'preview') setOpenDocId(docId);
  };

  // Drag & drop
  useE(() => {
    const onEnter = (e) => { e.preventDefault(); dragCounter.current++; if (e.dataTransfer?.types?.includes('Files')) setDragging(true); };
    const onOver  = (e) => { e.preventDefault(); };
    const onLeave = (e) => { e.preventDefault(); dragCounter.current--; if (dragCounter.current <= 0) { setDragging(false); dragCounter.current = 0; } };
    const onDrop  = (e) => { e.preventDefault(); dragCounter.current = 0; setDragging(false); if (e.dataTransfer?.files?.length) setToast(`${e.dataTransfer.files.length} archivos subidos`); };
    window.addEventListener('dragenter', onEnter);
    window.addEventListener('dragover', onOver);
    window.addEventListener('dragleave', onLeave);
    window.addEventListener('drop', onDrop);
    return () => {
      window.removeEventListener('dragenter', onEnter);
      window.removeEventListener('dragover', onOver);
      window.removeEventListener('dragleave', onLeave);
      window.removeEventListener('drop', onDrop);
    };
  }, []);

  // Keyboard
  useE(() => {
    const h = (e) => {
      if (e.key === 'Escape') { setSelected(new Set()); setOpenDocId(null); setCtxMenu(null); }
      if (e.key === ' ' && selected.size === 1 && e.target.tagName !== 'INPUT') {
        e.preventDefault();
        setOpenDocId([...selected][0]);
      }
    };
    document.addEventListener('keydown', h);
    return () => document.removeEventListener('keydown', h);
  }, [selected]);

  const openDoc_obj = openDocId ? data.docs.find(d => d.id === openDocId) : null;
  const allSelected = visibleDocs.length > 0 && visibleDocs.every(d => selected.has(d.id));

  const showDashboard = selectedView === 'inicio' && search.trim() === '' && !filters.kind && !filters.owner && !filters.status && !filters.date && !selectedTag;

  return (
    <div style={{ display: 'flex', height: '100%', width: '100%', position: 'relative', background: 'var(--bg)' }}>
      <Sidebar
        collapsed={tweaks.sidebarCollapsed}
        selectedView={selectedView}
        onSelectView={(v) => { setSelectedView(v); setSelected(new Set()); setSearch(''); }}
        selectedFolder={selectedFolder}
        onSelectFolder={setSelectedFolder}
        selectedTag={selectedTag}
        onSelectTag={setSelectedTag}
        data={data}
        onToggleCollapsed={() => setTweaks({ ...tweaks, sidebarCollapsed: !tweaks.sidebarCollapsed })}
      />

      <main style={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0, position: 'relative' }}>
        <Topbar
          breadcrumb={breadcrumb}
          onCrumbClick={(b) => { if (data.folders.some(f => f.id === b.id) || getFolderPath(data.folders, b.id)) { setSelectedView('carpeta'); setSelectedFolder(b.id); } }}
          search={search} onSearch={setSearch}
          viewMode={viewMode} onViewMode={setViewMode}
          onAction={handleAction}
          onSelectResult={openDoc}
          data={data}
          onOpenNotifs={() => setNotifOpen(true)}
          notifCount={4}
        />

        {/* Content header */}
        <div style={{ padding: '18px 18px 8px', display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', gap: 16 }}>
          <div>
            <h1 style={{ fontSize: 22, fontWeight: 600, margin: '0 0 2px', letterSpacing: '-0.01em' }}>
              {showDashboard ? 'Buenos días, Laura' : breadcrumb[breadcrumb.length - 1].label}
            </h1>
            <div style={{ fontSize: 12.5, color: 'var(--fg-muted)' }}>
              {showDashboard ? 'Tienes 3 documentos que requieren tu firma hoy.' : `${visibleDocs.length} documentos${selectedTag ? ` · etiqueta "${data.tags.find(t=>t.id===selectedTag)?.label}"` : ''}`}
            </div>
          </div>
          {!showDashboard && (
            <div style={{ display: 'flex', gap: 6 }}>
              <button onClick={() => handleAction('new-folder')} style={{
                display: 'flex', alignItems: 'center', gap: 6, padding: '6px 10px',
                borderRadius: 6, border: '1px solid var(--border)',
                background: 'var(--bg-elev)', color: 'var(--fg)', fontSize: 12.5,
              }}><Icon.Folder size={13} /> Nueva carpeta</button>
              <button onClick={() => handleAction('scan')} style={{
                display: 'flex', alignItems: 'center', gap: 6, padding: '6px 10px',
                borderRadius: 6, border: '1px solid var(--border)',
                background: 'var(--bg-elev)', color: 'var(--fg)', fontSize: 12.5,
              }}><Icon.Scan size={13} /> Escanear (OCR)</button>
            </div>
          )}
        </div>

        {showDashboard ? (
          <div style={{ flex: 1, overflow: 'auto' }}>
            <DocsUI.OverviewCards data={data} onAction={handleAction} />
            <div style={{ display: 'grid', gridTemplateColumns: '1.5fr 1fr', gap: 12, padding: '14px 18px' }}>
              <DocsUI.ApprovalsPanel approvals={data.approvals} docs={data.docs} onOpenDoc={openDoc} />
              <DocsUI.ActivityPanel activity={data.activity} docs={data.docs} />
            </div>

            <div style={{ padding: '4px 18px 24px' }}>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 10 }}>
                <h2 style={{ fontSize: 14, fontWeight: 600, margin: 0 }}>Recientes</h2>
                <button onClick={() => setSelectedView('recientes')} style={{ fontSize: 12, color: 'var(--fg-muted)', display: 'flex', alignItems: 'center', gap: 3 }}>
                  Ver todos <Icon.Arrow size={11} />
                </button>
              </div>
              <div style={{ background: 'var(--bg-elev)', border: '1px solid var(--border)', borderRadius: 10, overflow: 'hidden' }}>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(200px, 1fr))', gap: 0 }}>
                  {data.docs.slice(0, 6).map((d, i) => {
                    const kind = data.kinds[d.kind];
                    return (
                      <button key={d.id} onClick={() => openDoc(d.id)} className="nav-item" style={{
                        display: 'flex', alignItems: 'center', gap: 10, padding: '12px 14px',
                        borderRight: (i % 3 !== 2) ? '1px solid var(--border)' : 'none',
                        borderBottom: i < 3 ? '1px solid var(--border)' : 'none',
                        background: 'transparent', color: 'var(--fg)', textAlign: 'left',
                      }}>
                        <div style={{
                          width: 34, height: 34, borderRadius: 6, flexShrink: 0,
                          background: `color-mix(in oklch, ${kind.tone} 16%, var(--bg-elev-2))`,
                          display: 'flex', alignItems: 'center', justifyContent: 'center',
                          color: kind.tone, fontSize: 9, fontFamily: 'JetBrains Mono, monospace', fontWeight: 600,
                        }}>{kind.label}</div>
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ fontSize: 12.5, fontWeight: 500, color: 'var(--fg)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', marginBottom: 2 }}>{d.name}</div>
                          <div style={{ fontSize: 11, color: 'var(--fg-dim)' }}>{d.modified} · v{d.version}</div>
                        </div>
                      </button>
                    );
                  })}
                </div>
              </div>
            </div>
          </div>
        ) : (
          <>
            <DocsUI.FiltersRow filters={filters} onFilters={setFilters} onClear={() => setFilters({ kind: null, owner: null, status: null, date: null })} data={data} />
            {viewMode === 'list' ? (
              <DocsUI.ListView docs={visibleDocs} selected={selected} onToggleSelect={toggleSelect} onSelectAll={selectAll} allSelected={allSelected} onOpenDoc={openDoc} onContextMenu={contextMenu} />
            ) : (
              <DocsUI.GridView docs={visibleDocs} selected={selected} onToggleSelect={toggleSelect} onOpenDoc={openDoc} onContextMenu={contextMenu} />
            )}
          </>
        )}

        <DocsUI.BulkBar count={selected.size} onClear={clearSel} onAction={(a) => { handleAction(a); clearSel(); }} />
      </main>

      {openDoc_obj && <DrawerUI.DetailDrawer doc={openDoc_obj} onClose={() => setOpenDocId(null)} onAction={handleAction} />}

      <DrawerUI.ContextMenu ctx={ctxMenu} onClose={() => setCtxMenu(null)} onAction={handleAction} />
      <DrawerUI.NotifPopover open={notifOpen} onClose={() => setNotifOpen(false)} />
      <DrawerUI.DropZoneOverlay active={dragging} />
      <DrawerUI.Toast toast={toast} onClose={() => setToast(null)} />

      <TweaksPanel state={tweaks} setState={setTweaks} />

      <style>{`
        @keyframes slide-in { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: translateX(0); } }
        .nav-item:hover { background: var(--bg-hover) !important; }
        .nav-item[data-active]:hover { background: var(--bg-active) !important; }
        input::placeholder { color: var(--fg-dim); }
        mark { background: var(--accent-soft); color: var(--fg); }
        button { transition: background 0.1s, color 0.1s, border-color 0.1s; }
      `}</style>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);


</script>
</body>
</html>
