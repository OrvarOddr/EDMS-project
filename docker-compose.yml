services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: edms
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "8057:9000"
    networks:
      - backend
    restart: unless-stopped

  api-gateway:
    build: ./services/api-gateway
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      AUTH_SERVICE_URL: http://auth-service:8001
      DOCUMENT_SERVICE_URL: http://document-service:8002
      WORKFLOW_SERVICE_URL: http://workflow-service:8003
      COLLABORATION_SERVICE_URL: http://collaboration-service:8004
      FILE_SERVICE_URL: http://file-service:8005
    depends_on:
      - auth-service
      - document-service
      - workflow-service
      - collaboration-service
      - file-service
    networks:
      - backend
    restart: unless-stopped

  auth-service:
    build: ./services/auth-service
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/edms?options=-csearch_path=auth
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  document-service:
    build: ./services/document-service
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/edms?options=-csearch_path=documents
      WORKFLOW_SERVICE_URL: http://workflow-service:8003
      FILE_SERVICE_URL: http://file-service:8005
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  workflow-service:
    build: ./services/workflow-service
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/edms?options=-csearch_path=workflow
      DOCUMENT_SERVICE_URL: http://document-service:8002
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  collaboration-service:
    build: ./services/collaboration-service
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/edms?options=-csearch_path=collaboration
      DOCUMENT_SERVICE_URL: http://document-service:8002
      WORKFLOW_SERVICE_URL: http://workflow-service:8003
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  file-service:
    build: ./services/file-service
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/edms?options=-csearch_path=files
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: documents
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - backend
    restart: unless-stopped

  frontend:
    build: ./frontend
    networks:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8052:80"
    volumes:
      - ./infra/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-gateway
      - frontend
    networks:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:

networks:
  backend:
    driver: bridge
