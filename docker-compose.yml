services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}
      POSTGRES_DB: edms
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-init:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}
      POSTGRES_DB: edms
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD requerido}
      DOCUMENTS_DB_PASSWORD: ${DOCUMENTS_DB_PASSWORD:?DOCUMENTS_DB_PASSWORD requerido}
      WORKFLOW_DB_PASSWORD: ${WORKFLOW_DB_PASSWORD:?WORKFLOW_DB_PASSWORD requerido}
      COLLABORATION_DB_PASSWORD: ${COLLABORATION_DB_PASSWORD:?COLLABORATION_DB_PASSWORD requerido}
      FILES_DB_PASSWORD: ${FILES_DB_PASSWORD:?FILES_DB_PASSWORD requerido}
    volumes:
      - ./infra/postgres/init-service-users.sh:/init-service-users.sh:ro
    command: ["sh", "/init-service-users.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    restart: "no"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD requerido}
    volumes:
      - minio_data:/data
    ports:
      - "8057:9001"
    networks:
      - backend
    restart: unless-stopped

  api-gateway:
    build: ./services/api-gateway
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY requerido}
      JWT_ISSUER: ${JWT_ISSUER:?JWT_ISSUER requerido}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?JWT_AUDIENCE requerido}
      AUTH_SERVICE_URL: http://auth-service:8001
      DOCUMENT_SERVICE_URL: http://document-service:8002
      WORKFLOW_SERVICE_URL: http://workflow-service:8003
      COLLABORATION_SERVICE_URL: http://collaboration-service:8004
      FILE_SERVICE_URL: http://file-service:8005
    depends_on:
      - auth-service
      - document-service
      - workflow-service
      - collaboration-service
      - file-service
    networks:
      - backend
    restart: unless-stopped

  auth-service:
    build: ./services/auth-service
    environment:
      DATABASE_URL: postgresql://edms_auth:${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD requerido}@postgres:5432/edms?options=-csearch_path=auth
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY requerido}
      JWT_ISSUER: ${JWT_ISSUER:?JWT_ISSUER requerido}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?JWT_AUDIENCE requerido}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@edms.dev}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD requerido}
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    networks:
      - backend
    restart: unless-stopped

  document-service:
    build: ./services/document-service
    environment:
      DATABASE_URL: postgresql://edms_documents:${DOCUMENTS_DB_PASSWORD:?DOCUMENTS_DB_PASSWORD requerido}@postgres:5432/edms?options=-csearch_path=documents
      WORKFLOW_SERVICE_URL: http://workflow-service:8003
      FILE_SERVICE_URL: http://file-service:8005
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    networks:
      - backend
    restart: unless-stopped

  workflow-service:
    build: ./services/workflow-service
    environment:
      DATABASE_URL: postgresql://edms_workflow:${WORKFLOW_DB_PASSWORD:?WORKFLOW_DB_PASSWORD requerido}@postgres:5432/edms?options=-csearch_path=workflow
      DOCUMENT_SERVICE_URL: http://document-service:8002
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    networks:
      - backend
    restart: unless-stopped

  collaboration-service:
    build: ./services/collaboration-service
    environment:
      DATABASE_URL: postgresql://edms_collaboration:${COLLABORATION_DB_PASSWORD:?COLLABORATION_DB_PASSWORD requerido}@postgres:5432/edms?options=-csearch_path=collaboration
      DOCUMENT_SERVICE_URL: http://document-service:8002
      WORKFLOW_SERVICE_URL: http://workflow-service:8003
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    networks:
      - backend
    restart: unless-stopped

  file-service:
    build: ./services/file-service
    environment:
      DATABASE_URL: postgresql://edms_files:${FILES_DB_PASSWORD:?FILES_DB_PASSWORD requerido}@postgres:5432/edms?options=-csearch_path=files
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD requerido}
      MINIO_BUCKET: documents
      MAX_FILE_SIZE_MB: 100
      DOCUMENT_SERVICE_URL: http://document-service:8002
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      minio:
        condition: service_started
    networks:
      - backend
    restart: unless-stopped

  frontend:
    build: ./frontend
    networks:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8052:80"
    volumes:
      - ./infra/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-gateway
      - frontend
    networks:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:

networks:
  backend:
    driver: bridge
