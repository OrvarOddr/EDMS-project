name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - develop

jobs:
  deploy:
    name: Deploy a producción
    runs-on: ubuntu-latest
    # Solo despliega si el pipeline de CI termino en verde sobre develop.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Deploy al servidor via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          host: pacheco.chillan.ubiobio.cl
          username: alejandroortiz2101
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GH_TOKEN
          # El rebuild de todos los servicios puede superar el timeout por
          # defecto del action (10m). Se amplia a 30m como colchon.
          command_timeout: 30m
          script: |
            set -e
            cd /home/alejandroortiz2101/EDMS-project

            # Sincroniza con remoto descartando estado local divergente
            # (squash-merges crean commits nuevos; fast-forward simple no basta).
            git fetch https://$GH_TOKEN@github.com/OrvarOddr/EDMS-project.git develop
            git reset --hard FETCH_HEAD

            # Completar variables nuevas del .env del servidor sin imprimir secretos
            touch .env

            generate_secret() {
              openssl rand -hex "$1"
            }

            ensure_env_var() {
              key="$1"
              value="$2"

              if grep -q "^${key}=" .env; then
                return 0
              fi

              printf "%s=%s\n" "$key" "$value" >> .env
            }

            ensure_env_var POSTGRES_PASSWORD "$(generate_secret 24)"
            ensure_env_var AUTH_DB_PASSWORD "$(generate_secret 24)"
            ensure_env_var DOCUMENTS_DB_PASSWORD "$(generate_secret 24)"
            ensure_env_var WORKFLOW_DB_PASSWORD "$(generate_secret 24)"
            ensure_env_var COLLABORATION_DB_PASSWORD "$(generate_secret 24)"
            ensure_env_var FILES_DB_PASSWORD "$(generate_secret 24)"
            ensure_env_var MINIO_ROOT_PASSWORD "$(generate_secret 24)"
            ensure_env_var JWT_SECRET_KEY "$(generate_secret 32)"
            ensure_env_var JWT_ISSUER "edms-auth"
            ensure_env_var JWT_AUDIENCE "edms"
            ensure_env_var BOOTSTRAP_ADMIN_EMAIL "admin@edms.dev"
            ensure_env_var BOOTSTRAP_ADMIN_PASSWORD "$(generate_secret 24)"

            # Rebuild incremental (con caché de capas) y levantar servicios.
            # Antes se usaba --no-cache, que reconstruia los 7 servicios desde
            # cero en cada deploy y superaba el timeout del SSH (~10m). Con
            # caché, solo se reconstruyen las capas que cambiaron.
            docker-compose build
            docker-compose up -d || (docker-compose logs --tail=50 && exit 1)

            # Recargar nginx para aplicar cualquier cambio de config
            docker-compose restart nginx

            # Confirmar estado final
            docker-compose ps
