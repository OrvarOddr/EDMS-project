name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read

jobs:

  secrets-scan:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-backend:
    name: Lint backend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, document-service, workflow-service, collaboration-service, file-service, api-gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar ruff
        run: pip install ruff
      - name: Lint ${{ matrix.service }}
        run: ruff check services/${{ matrix.service }}/

  lint-frontend:
    name: Lint frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend

  test-document-service:
    name: Test document-service
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: document_service_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d document_service_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r requirements.txt pytest
        working-directory: services/document-service
      - name: Tests
        run: PYTHONPATH=. pytest -q
        env:
          DATABASE_URL: "postgresql+psycopg2://postgres:postgres@localhost:5432/document_service_test"
        working-directory: services/document-service

  test-auth-service:
    name: Test auth-service
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: auth_service_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d auth_service_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt
        working-directory: services/auth-service
      - name: Tests
        run: PYTHONPATH=. pytest -q
        env:
          DATABASE_URL: "postgresql+psycopg2://postgres:postgres@localhost:5432/auth_service_test"
        working-directory: services/auth-service

  test-workflow-service:
    name: Test workflow-service
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: workflow_service_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d workflow_service_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt
        working-directory: services/workflow-service
      - name: Tests
        run: PYTHONPATH=. pytest -q
        env:
          DATABASE_URL: "postgresql+psycopg2://postgres:postgres@localhost:5432/workflow_service_test"
        working-directory: services/workflow-service

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    needs: lint-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

  validate-dockerfiles:
    name: Validar Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar hadolint
        run: |
          wget -qO /usr/local/bin/hadolint https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          chmod +x /usr/local/bin/hadolint
      - name: Validar Dockerfiles
        run: |
          find . -name "Dockerfile" -not -path "*/.git/*" | xargs hadolint --ignore DL3008 --ignore DL3013 --ignore DL3042 --ignore DL3016
