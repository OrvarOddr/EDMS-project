version: 2
updates:
  # Backend: una entrada por servicio (cada uno tiene su requirements.txt)
  - package-ecosystem: "pip"
    directory: "/services/api-gateway"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/services/auth-service"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/services/document-service"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/services/workflow-service"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/services/collaboration-service"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/services/file-service"
    schedule:
      interval: "weekly"

  # Frontend
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
